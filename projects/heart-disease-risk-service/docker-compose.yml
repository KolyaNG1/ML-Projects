services:
  api:
    build: .
    command: uvicorn heart_risk.api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"

  web:
    build: .
    command: streamlit run web/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000/score
    ports:
      - "8501:8501"
    depends_on:
      - api

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-risk-service"
version = "0.1.0"
description = "Учебный сервис оценки риска сердечно-сосудистых заболеваний"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
